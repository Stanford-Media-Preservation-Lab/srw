[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srw"
version = "1.4.1"
description = "SMPL RAWcooked Workflow for batch DPX to FFv1/MKV preservation transcoding"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Stanford Media Preservation Lab" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
srw = "srw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["srw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
